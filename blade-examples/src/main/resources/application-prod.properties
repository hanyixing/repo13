# ============================================================
# Production environment
# Loaded by Blade at runtime via:  java -jar app.jar --app.env=prod
# (Blade reads .properties only; the matching .yml is a mirror.)
#
# Do NOT commit real secrets here. Provide real credentials through
# application-local.properties or environment-injected config
# (both are git-ignored). Values below are placeholders.
# ============================================================
app.env=prod
app.name=blade-examples
server.port=9001
app.show-banner=false
log.level=WARN

datasource.url=jdbc:mysql://prod-db:3306/blade
datasource.username=blade
datasource.password=CHANGE_ME
