# ============================================================
# Development environment
# Loaded by Blade at runtime via:  java -jar app.jar --app.env=dev
# (Blade reads .properties only; the matching .yml is a mirror.)
# ============================================================
app.env=dev
app.name=blade-examples (dev)
server.port=9001
app.show-banner=true
log.level=DEBUG

# Local datasource - safe placeholder values.
# Put real/local overrides in application-local.properties (git-ignored).
datasource.url=jdbc:mysql://localhost:3306/blade_dev
datasource.username=dev
datasource.password=dev123
